<!DOCTYPE html>>
<html>
    <head>
        <title>Calculator App</title>
    </head>
    <body>
        <h1>Calculator App</h1>
        <label for="num1">First Number:</label>
        <input type="number" id="num1"><br><br>
        <label for="num2">Second Number:</label>
        <input type="number" id="num"><br><br>
        <button onclick="addition()">Addition</button>
        <p id="add">Addition:</p>
        <button onclick="max()">Max Number</button>
        <p id="max">Max Number:</p>
        <script>
            function addition(){
                let a=Number(document.getElementById("num1").value);
                let b=Number(document.getElementById("num2").value);
                let res=a+b;
                document.getElementById("add").innerText=`Addition: ${res}`;

            }
            function max(){
                let a=Number(document.getElementById("num1").value);
                let b=Number(document.getElementById("num2").value);
                if(a>b){
                    document.getElementById("max").innerText=`Max Number: ${a}}`;
                }
                else
                document.getElementById("max").innerText=`Max Number: ${b}}`;
            }
        </script>

    </body>
</html>
